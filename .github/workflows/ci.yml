name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新推送取消仍在跑的旧任务，节省 CI 分钟数
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    env:
      # CI 没有显示器，让 Qt 走离屏后端
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PyQt6 的 wheel 自带 Qt，但 Linux 上离屏运行还需要这些系统库
      - name: Install Linux Qt system libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 fonts-dejavu-core

      # 用 pyproject 的 dev extra 统一管理 pytest / ruff，顺带验证包元数据能否安装
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff check
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest -q
