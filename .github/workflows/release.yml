name: Release (Windows exe)

# 打 tag（v*）时自动构建 Windows 免安装版，并挂到对应 Release 上。
# 标签里带 “debug” 的会发布为 pre-release（调试版），不影响正式版。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write          # 需要写 Release 的权限

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      # token extra：把 browser_cookie3 装进去（应用内“自动获取凭证”要用）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,token]" pyinstaller

      - name: Build exe (PyInstaller)
        run: python dev/build_exe.py

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/LyriCast/*" `
            -DestinationPath "LyriCast-${{ github.ref_name }}-win64.zip"

      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - uploading asset"
          else
            EXTRA=""
            case "$TAG" in
              *debug*) EXTRA="--prerelease" ;;   # 调试版：预发布
            esac
            gh release create "$TAG" --title "$TAG" \
              --notes "自动构建的 Windows 免安装版。下载 zip 解压后双击 LyriCast.exe。详见 README / CHANGELOG.md。" \
              $EXTRA
          fi
          gh release upload "$TAG" "LyriCast-$TAG-win64.zip" --clobber
