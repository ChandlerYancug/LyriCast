name: Bug 报告 (Bug report)
description: 报告 LyriCast 的崩溃、异常行为或显示错误
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量补全下面的信息，能大幅加快定位速度。
        提交前请先搜索 [已有 issue](https://github.com/ChandlerYancug/LyriCast/issues)，避免重复。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？和你预期的行为差在哪里？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 播放 ...
        3. 看到 ...
    validations:
      required: true

  - type: input
    id: speaker
    attributes:
      label: 音箱品牌 / 型号
      placeholder: 例如：Sonos One (Gen 2)、小爱音箱 Pro、HomePod (AirPlay)、AirPort Express ...
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: 音箱后端类型
      description: 不确定的话，可在托盘菜单点「导出当前曲目信息」，或运行 dev/debug_speaker.py 查看实际后端。
      options:
        - sonos
        - upnp
        - smtc
        - listen（麦克风，路线图，尚未实现）
        - 不确定 / 其他
    validations:
      required: true

  - type: input
    id: os-python
    attributes:
      label: 操作系统与 Python 版本
      placeholder: 例如：Windows 11 23H2 / Python 3.12.4；macOS 14.5 / Python 3.11.9
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志内容
      description: |
        日志文件：`%LOCALAPPDATA%\LyriCast\logs\lyricast.log`（Windows）。
        macOS / Linux 请附上对应日志文件内容；找不到日志文件时，可直接粘贴控制台输出。
      render: text
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 是否附截图？
      description: 界面显示类问题请拖拽上传截图或录屏；没有截图请填「无」。
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue，没有发现相同问题
          required: true
        - label: 我在最新版本上复现过该问题（或已注明具体版本）
          required: false
